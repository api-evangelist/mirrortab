name: MirrorTab
description: >-
  MirrorTab is a cybersecurity company that stops automated attacks against web
  applications and APIs by serving the application through an isolated,
  server-side rendered browser session so the DOM, code, and data are never
  exposed to the end browser. Rather than detecting bots, it removes the surface
  they operate on, blocking credential stuffing, agentic-AI automation,
  man-in-the-browser attacks, malicious extensions, XSS, formjacking,
  clickjacking, and CSRF without endpoint agents or application code changes.
  MirrorTab is edge-driven and integrates alongside existing CDNs, WAFs, and
  fraud platforms. Founded by the CTO and co-founder of Honey (acquired by
  PayPal), the company also publishes a public v1 REST API to programmatically
  create, list, and remove MirrorTab browser sessions.
